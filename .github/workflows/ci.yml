name: ci
on: [push, pull_request]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    # Le CI valide le MÊME mode de conversion que l'origine technique. Sans cette déclaration, le
    # build tomberait sur le défaut `off` — aucun CTA, aucun formulaire — et les assertions portant
    # sur le parcours de conversion passeraient à côté de leur objet.
    env:
      CONVERSION_MODE: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Types puis logique, AVANT le build : un gate cassé (registre Zod, sous-ensemble de claims
      # d'un visuel, résolution CTA) doit rougir sur la PR, pas seulement sur le poste de dev.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # Assertions portant sur l'export lui-même : absence de CTA dans out/, visuel rendu avec alt
      # et figcaption, manifeste d'attribution. Elles se sautent d'elles-mêmes quand out/ n'existe
      # pas encore — les relancer ICI est la seule façon de garantir qu'elles s'exécutent vraiment.
      - run: pnpm exec vitest run tests/exported-html.test.ts

      - run: pnpm validate:jsonld
