name: ci
on: [push, pull_request]

jobs:
  build-validate:
    runs-on: ubuntu-latest

    # Les DEUX contrats de mode sont exécutés, pas seulement celui de l'origine technique.
    #
    # Ils ne disent pas la même chose : `off` promet qu'aucun CTA ni formulaire actif n'existe et
    # que le manifeste résout à null ; `demo` promet le parcours complet, la version renseignée et
    # l'absence de toute action externe. Un seul des deux ne prouverait que la moitié.
    #
    # C'est la leçon des deux échecs CI de S2A transformée en invariant : le vert local ne
    # reproduisait pas le CI, et un test codait un mode en dur. La matrice retire cette
    # vérification des mains du développeur.
    strategy:
      fail-fast: false
      matrix:
        # Guillemets OBLIGATOIRES : en YAML, `off` non quoté est le booléen false.
        conversion_mode: ["off", "demo"]

    env:
      CONVERSION_MODE: ${{ matrix.conversion_mode }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Types puis logique, AVANT le build : un gate cassé (registre Zod, sous-ensemble de claims
      # d'un visuel, résolution CTA) doit rougir sur la PR, pas seulement sur le poste de dev.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # Assertions portant sur l'export lui-même : absence ou présence du CTA selon le mode, visuel
      # avec alt et figcaption, manifeste d'attribution. Elles se sautent d'elles-mêmes quand out/
      # n'existe pas encore — les relancer ICI est la seule façon de garantir qu'elles s'exécutent.
      - run: pnpm exec vitest run tests/exported-html.test.ts

      - run: pnpm validate:jsonld

      # Confronte le registre éditorial au manifeste produit épinglé et résout la provenance de
      # chaque document. Échoue si le site est plus permissif que le produit, ou si une référence de
      # preuve ne se résout pas ; imprime sans bloquer les écarts qui appellent une décision.
      #
      # Hors matrice de mode : la dérive de déclarations ne dépend pas de CONVERSION_MODE.
      - run: pnpm verify:product-manifest
        if: matrix.conversion_mode == 'demo'
