name: ci
on: [push, pull_request]

jobs:
  build-validate:
    runs-on: ubuntu-latest

    # Les DEUX contrats de mode sont exécutés, pas seulement celui de l'origine technique.
    #
    # Ils ne disent pas la même chose : `off` promet qu'aucun CTA ni formulaire actif n'existe et
    # que le manifeste résout à null ; `demo` promet le parcours complet, la version renseignée et
    # l'absence de toute action externe. Un seul des deux ne prouverait que la moitié.
    #
    # C'est la leçon des deux échecs CI de S2A transformée en invariant : le vert local ne
    # reproduisait pas le CI, et un test codait un mode en dur. La matrice retire cette
    # vérification des mains du développeur.
    strategy:
      fail-fast: false
      matrix:
        # Guillemets OBLIGATOIRES : en YAML, `off` non quoté est le booléen false.
        conversion_mode: ["off", "demo"]

    env:
      CONVERSION_MODE: ${{ matrix.conversion_mode }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # PR21-FINAL-RELEASE-GATE §§5–6 — la vérification autoritative est
      # `pnpm verify:a3r`. Elle contrôle elle-même l'ORDRE des étapes :
      #   contract fingerprint → a3r-report → typecheck → content:verify
      #   → verify:product-manifest → rm -rf out → build → vitest
      #   → validate:jsonld → verify:a2r (fresh out/) → git diff --check.
      #
      # Le décommissionnement des anciennes commentaires « types puis logique
      # AVANT le build » est délibéré : plusieurs suites (a2r-*.test.ts,
      # a1r-fidelity-corpus, a2r-render-semantic-parity, insights-html-invariants,
      # a2r-exact-render-parity, a2r-surface-mutations) inspectent maintenant les
      # artefacts sous `out/`. Les faire tourner avant le build les faisait
      # échouer par manque d'artefacts sur runner fraîchement cloné.
      #
      # `verify:a3r` fait aussi rejouer verify:a2r sur le build frais (avec
      # A2R_SKIP_BUILD=1) pour empêcher toute régression de surface introduite
      # par une PR.
      - run: pnpm verify:a3r

  # JOB INDÉPENDANT, et non une branche de la matrice.
  #
  # Il l'était : `if: matrix.conversion_mode == 'demo'`. Cela évitait bien une exécution en double —
  # la dérive de déclarations ne dépend pas du mode de conversion — mais accrochait un gate de
  # gouvernance à une valeur de matrice. Supprimer ou renommer le mode `demo` l'aurait fait
  # disparaître SANS BRUIT : la CI serait restée verte en ayant cessé de vérifier que le site ne
  # dépasse pas le produit.
  #
  # Un job séparé rend cette disparition impossible à obtenir par accident, et le test structurel
  # `tests/ci-contract.test.ts` verrouille sa présence dans ce fichier.
  product-truth:
    name: product truth (dérive & provenance)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Confronte le registre éditorial au manifeste produit épinglé et résout la provenance de
      # chaque document. Échoue si le site est plus permissif que le produit, ou si une référence
      # de preuve ne se résout pas ; imprime sans bloquer les écarts qui appellent une décision.
      #
      # Aucun build préalable : le vérificateur lit le contenu par le même loader que les pages.
      - run: pnpm verify:product-manifest
