name: deploy-pages

# Déploie l'export statique Next.js (out/) sur GitHub Pages à chaque push sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Même barrière que le workflow `ci` — dupliquée à dessein : `needs` ne franchit pas la
      # frontière d'un workflow, et `ci` tourne EN PARALLÈLE de ce déploiement sur un push `main`.
      # Sans ces étapes ici, un arbre dont les tests échouent partirait en production pendant que
      # le CI rougit. Un déploiement ne se rattrape pas : il se refuse.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # Assertions portant sur out/ : ne peuvent s'exécuter qu'après l'export (elles se sautent
      # d'elles-mêmes sinon). C'est le dernier verrou avant la mise en ligne de cet artefact.
      - run: pnpm exec vitest run tests/exported-html.test.ts

      - run: pnpm validate:jsonld
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
