<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img"
     aria-labelledby="apu1-title apu1-desc" font-family="system-ui, sans-serif">
  <title id="apu1-title">Total Authority Presence is the union of direct and indirect presence</title>
  <desc id="apu1-desc">Two overlapping circles. The left circle is Direct Share of Model — observations where the brand is cited as a source. The right circle is Indirect Mention Share, which counts observations where the brand is named in the answer regardless of citation. They overlap in the middle: observations where the brand is both cited as a source and named in the answer. Total Authority Presence is the whole shaded area covered by either circle, counted once. The overlap is not counted twice, so Total is never the sum of the two shares.</desc>

  <!-- viewBox volontairement étroit : à 327 px de large (mobile), l'échelle reste ~0.9,
       donc les libellés se rendent au-dessus de 10 px. Un SVG lisible seulement en desktop
       ne remplit pas son rôle. -->
  <rect width="360" height="330" fill="#ffffff"/>
  <text x="180" y="26" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Total Authority Presence</text>
  <text x="180" y="46" font-size="14" font-weight="600" fill="#3b6fd4" text-anchor="middle">= Direct ∪ Indirect</text>

  <g>
    <circle cx="140" cy="150" r="78" fill="#3b6fd4" fill-opacity="0.16" stroke="#3b6fd4" stroke-width="2"/>
    <circle cx="220" cy="150" r="78" fill="#3b6fd4" fill-opacity="0.16" stroke="#6b7686" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <text x="98" y="148" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Direct</text>
  <text x="262" y="148" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Indirect</text>

  <text x="180" y="144" font-size="12" font-weight="600" fill="#1c2430" text-anchor="middle">both</text>
  <text x="180" y="160" font-size="12" fill="#4a5361" text-anchor="middle">counted</text>
  <text x="180" y="174" font-size="12" fill="#4a5361" text-anchor="middle">once</text>

  <!-- Définitions sous les cercles : à l'étroit, on empile plutôt que de serrer. -->
  <text x="14" y="262" font-size="13" font-weight="600" fill="#1c2430">Direct</text>
  <text x="72" y="262" font-size="13" fill="#4a5361">cited as a source</text>
  <text x="14" y="284" font-size="13" font-weight="600" fill="#1c2430">Indirect</text>
  <text x="72" y="284" font-size="13" fill="#4a5361">named in the answer</text>

  <text x="180" y="314" font-size="12" fill="#8a2f2f" text-anchor="middle">An observation in the overlap counts once — never twice.</text>
</svg>
