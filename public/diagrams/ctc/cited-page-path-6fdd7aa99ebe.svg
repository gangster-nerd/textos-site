<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="cited-page-path-title cited-page-path-desc">
  <title id="cited-page-path-title">From a cited page to a proposed passage</title>
  <desc id="cited-page-path-desc">From a cited page to a proposed passage. A 4-step flow: robots.txt first, then Bounded reading, then Up to three passages, then Person qualifies. A dashed boundary after &quot;Up to three passages&quot; is labelled Human step: Nothing proposed reaches the writer before a person decides.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#4d7fa6"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#101216"/>
  <text x="72" y="82" fill="#f7f8f9" font-family="system-ui, sans-serif" font-size="34" font-weight="600">From a cited page to a proposed passage</text>
  <text x="72" y="124" fill="#9aa0a6" font-family="system-ui, sans-serif" font-size="22">Illustrative path for one source. Reading is bounded; accepting is human.</text>
  <g font-family="system-ui, sans-serif">
      <rect x="54" y="246" width="246" height="174" rx="18" fill="#0b0c0e" stroke="#2f333a" stroke-width="2"/>
    <text x="177" y="292" text-anchor="middle" fill="#7cc4ff" font-size="18" font-weight="600">1 · ASK</text>
    <text x="177" y="350" text-anchor="middle" fill="#f7f8f9" font-size="24" font-weight="600">robots.txt first</text>
    <rect x="336" y="246" width="246" height="174" rx="18" fill="#0b0c0e" stroke="#2f333a" stroke-width="2"/>
    <text x="459" y="292" text-anchor="middle" fill="#7cc4ff" font-size="18" font-weight="600">2 · READ</text>
    <text x="459" y="350" text-anchor="middle" fill="#f7f8f9" font-size="24" font-weight="600">Bounded reading</text>
    <rect x="618" y="246" width="246" height="174" rx="18" fill="#0b0c0e" stroke="#2f333a" stroke-width="2"/>
    <text x="741" y="292" text-anchor="middle" fill="#7cc4ff" font-size="18" font-weight="600">3 · PROPOSE</text>
    <text x="741" y="337" text-anchor="middle" fill="#f7f8f9" font-size="24" font-weight="600">Up to three</text>
    <text x="741" y="370" text-anchor="middle" fill="#f7f8f9" font-size="24" font-weight="600">passages</text>
    <rect x="900" y="246" width="246" height="174" rx="18" fill="#0b0c0e" stroke="#7cc4ff" stroke-width="3"/>
    <text x="1023" y="292" text-anchor="middle" fill="#7cc4ff" font-size="18" font-weight="600">4 · QUALIFY</text>
    <text x="1023" y="350" text-anchor="middle" fill="#f7f8f9" font-size="24" font-weight="600">Person qualifies</text>
  </g>
  <g stroke="#4d7fa6" stroke-width="3" marker-end="url(#arrow)">
    <line x1="306" y1="333" x2="330" y2="333"/>
    <line x1="588" y1="333" x2="612" y2="333"/>
    <line x1="870" y1="333" x2="894" y2="333"/>
</g>
  <line x1="882" y1="194" x2="882" y2="484" stroke="#7cc4ff" stroke-width="3" stroke-dasharray="10 10"/>
  <rect x="694" y="500" width="376" height="110" rx="16" fill="#0b0c0e" stroke="#4d7fa6" stroke-width="2"/>
  <text x="882" y="540" text-anchor="middle" fill="#7cc4ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600">HUMAN STEP</text>
  <text x="882" y="570" text-anchor="middle" fill="#e9eaec" font-family="system-ui, sans-serif" font-size="18">Nothing proposed reaches the</text>
    <text x="882" y="596" text-anchor="middle" fill="#e9eaec" font-family="system-ui, sans-serif" font-size="18">writer before a person decides.</text>
</svg>
